project:
  type: book
  output-dir: docs
  preview:
    browser: true
    port: 4200
    watch-inputs: true

book:
  title: "Multispecies Stock Assessment: Mathematical Methods, Data, and Software"
  subtitle: "A Mathematical Review Towards Dynamic Size-Based Stock Assessment in mizer"
  author:
    - name: Gustav Delius
      email: gustav.delius@york.ac.uk
      affiliation:
        - name: Department of Mathematics, University of York
  date: today
  license: CC BY-NC-SA
  description: "Mathematical and statistical review of multispecies stock assessment methods, stomach content likelihoods, and size-structured assessment software."
  repo-url: https://github.com/gustavdelius/multispecies_stock_assessment
  repo-branch: main
  repo-actions: edit
  chapters:
    - index.md
    - 01_taxonomy_and_foundations.md
    - 02_age_structured_multispecies_models.md
    - 03_age_length_and_length_structured_models.md
    - 04_size_spectrum_and_food_web_models.md
    - 05_stomach_content_data_and_likelihoods.md
    - 06_statistical_fitting_uncertainty_and_mizer_synthesis.md
    - references.md

bibliography: references.bib
nocite: |
  @*

from: markdown+lists_without_preceding_blankline
filters:
  - mermaid.lua

format:
  html:
    theme: cosmo
    code-fold: true
    link-external-newwindow: true
    fig-width: 6
    fig-height: 4

toc: true
toc-depth: 4
number-depth: 3
number-sections: true
crossref:
  eq-prefix: Eq.
